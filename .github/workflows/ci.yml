# Continuous integration for DirkEngine. Each step runs a `just` recipe, so
# `just validate` checks locally what CI checks, and `just check-changed` what
# a change needs. `ci` is the single status to require: it fails if any job
# failed and passes when the rest succeeded or were skipped.

# Pull requests run only the jobs their changes can affect (see `changes`),
# and drafts skip macOS, the slowest runner, until marked ready. Pushes to
# main, the merge queue (`merge_group`) and manual runs run every job.

# Caches are saved from main only. Pull requests restore main's caches, so a
# branch never evicts them with copies no other branch can read.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat CI caches; restored dependency builds
  # make up for the lost reuse.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  # Decides which jobs a pull request needs from the paths it changes, by the
  # filters of .github/filters.yml, and holds macOS back while it is a draft.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      deny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deny == 'true' }}
      platforms: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: .github/filters.yml

  # Formatting, unused dependencies and, when the dependencies change, the
  # audit, which compile nothing. deny.yml also audits weekly.
  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-machete,cargo-deny
      - run: just fmt-check
      - run: just unused
      - if: needs.changes.outputs.deny == 'true'
        run: just audit

  # Clippy, the tests and the debug build, with every feature and with none,
  # on Linux and macOS (the platform layer differs). Clippy runs first so lint
  # failures report early; the tests reuse what it compiled.
  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # dirk_renderer's build script compiles rust-gpu's codegen backend
          # into this directory once per rust-gpu version, which takes
          # minutes; every job would otherwise repeat it.
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/rust-gpu' || '~/.cache/rust-gpu' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint
      - run: just test
      - run: just test-minimal
      - if: runner.os == 'Linux'
        run: just doc-test
      - if: runner.os == 'Linux'
        run: just doc
      - name: Bundle debug build and runtime assets
        run: |
          just build
          mkdir -p dist/dirkengine
          cp target/debug/dirkengine dist/dirkengine/
          cp -R assets dist/dirkengine/assets
          tar -C dist -czf dist/dirkengine-debug.tar.gz dirkengine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dirkengine-debug-${{ matrix.os }}
          path: dist/dirkengine-debug.tar.gz

  # The engineering standard's rules, on every change: they read more than the
  # Rust sources, such as standard.toml, the workflows and the Markdown.
  standard:
    name: standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just standard

  ci:
    name: ci
    if: always()
    needs:
      - changes
      - checks
      - rust
      - standard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, rust
          jobs: ${{ toJSON(needs) }}
