name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'README.md'

# Cancel any in-progress run on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"
          cache-all-crates: "true"

      - name: cargo check (default features)
        run: cargo check --workspace --locked

      - name: cargo check (no default features)
        run: cargo check --workspace --locked --no-default-features

      - name: cargo check (all features)
        run: cargo check --workspace --locked --all-features

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"
          cache-all-crates: "true"

      - name: Build debug
        run: cargo build --workspace --locked

      - name: Bundle debug build and runtime assets
        run: |
          mkdir -p dist/dirkengine
          cp target/debug/dirkengine scripts/run-bundle.sh dist/dirkengine/
          mv dist/dirkengine/run-bundle.sh dist/dirkengine/run.sh
          cp -R assets dist/dirkengine/assets
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/dist/dirkengine/run.sh" --help >/dev/null)
          tar -C dist -czf dist/dirkengine-debug.tar.gz dirkengine

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v6
        with:
          name: dirkengine-debug-${{ matrix.os }}
          path: dist/dirkengine-debug.tar.gz

          # This isn't cached properly, runs take 7min.
          # When we fix caching, uncomment
      # - name: Build release
      #   run: cargo build --workspace --locked --release

      # - name: Upload Release Artifact
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: dirkengine-release-${{ matrix.os }}
      #     path: target/release/dirkengine

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"
          cache-all-crates: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --locked
