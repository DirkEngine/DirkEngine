# Continuous integration for DirkEngine.
#
#   checks -> formatting, unused dependencies and the dependency audit,
#             which compile nothing
#   rust   -> clippy on every target (tests included), tests, and the debug
#             build, with every feature and with no default features, on
#             Linux and macOS (the platform layer differs); Linux also runs
#             the doc tests and builds the docs with warnings denied
#
# Each step runs a `just` recipe, so `just validate` checks locally what CI
# checks.
#
# Each job compiles once and reuses it for every step. Pull requests run only
# when their changes can affect the result (see `changes`), and draft pull
# requests skip macOS, the slowest runner, until they are marked ready. Pushes
# to main and manual runs run everything. `ci` is the single status to
# require: it fails if any job failed and passes when the rest succeeded or
# were skipped. deny.yml audits new advisories weekly.
#
# `merge_group` runs the full CI on the merge queue's temporary branch, so
# `main` can require a merge queue and `ci` together. The queue's runs are
# neither pull requests nor drafts, so they run every job on both platforms.
#
# Caches are saved from main only. Pull requests restore main's caches, so a
# branch never evicts them with copies no other branch can read.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat CI caches; restored dependency builds
  # make up for the lost reuse.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  # Decides which jobs a pull request needs from the paths it changes, and
  # holds macOS back while it is a draft. A file matches a filter only when it
  # matches every pattern, so anything outside the listed docs runs `rust`;
  # `deny` therefore uses one pattern.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      deny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deny == 'true' }}
      platforms: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/**'
              - '!AGENTS.md'
              - '!.agents/**'
              - '!.claude/**'
              - '!LICENSE'
              - '!t3.json'
              - '!.gitignore'
            deny:
              - '{Cargo.toml,**/Cargo.toml,Cargo.lock,deny.toml,.github/workflows/**}'

  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-machete,cargo-deny
      - run: just fmt-check
      - run: just unused
      - if: needs.changes.outputs.deny == 'true'
        run: just audit

  # Clippy runs first so lint failures report early; the tests then reuse the
  # dependencies it compiled for build scripts and proc macros.
  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Linux runs native tests on lavapipe, so failing to create a device
      # fails them instead of skipping them.
      DIRK_REQUIRE_GPU: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # dirk_renderer's build script compiles rust-gpu's codegen backend
          # into this directory once per rust-gpu version, which takes
          # minutes; every job would otherwise repeat it.
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/rust-gpu' || '~/.cache/rust-gpu' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint
      # Runners have no GPU, so native rendering tests run on Mesa's software
      # Vulkan driver (lavapipe) under the Khronos validation layer. Ubuntu's
      # Mesa 26.0.8 loses blits into a 3D image's slices past the first, so
      # lavapipe comes from the kisak-mesa PPA's newer Mesa (26.2.7 works).
      # The runner's apt reads only amd64v3 package lists, which the PPA
      # doesn't publish, so without `Architectures: amd64` on its source apt
      # silently keeps Ubuntu's Mesa; a pin then puts the PPA above Ubuntu's
      # archive. The last line prints the Mesa version the tests run on.
      - if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y --no-update ppa:kisak/kisak-mesa
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/kisak-ubuntu-kisak-mesa-*.sources
          printf 'Package: *\nPin: release o=LP-PPA-kisak-kisak-mesa\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/kisak-mesa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers
          dpkg-query -W mesa-vulkan-drivers
      - run: just test
      - run: just test-minimal
      - if: runner.os == 'Linux'
        run: just doc-test
      - if: runner.os == 'Linux'
        run: just doc
      - name: Bundle debug build and runtime assets
        run: |
          cargo build --workspace --locked
          mkdir -p dist/dirkengine
          cp target/debug/dirkengine dist/dirkengine/
          cp -R assets dist/dirkengine/assets
          tar -C dist -czf dist/dirkengine-debug.tar.gz dirkengine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dirkengine-debug-${{ matrix.os }}
          path: dist/dirkengine-debug.tar.gz

  ci:
    name: ci
    if: always()
    needs:
      - changes
      - checks
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, rust
          jobs: ${{ toJSON(needs) }}
