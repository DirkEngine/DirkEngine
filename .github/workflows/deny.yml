# Audits dependencies weekly, so newly published advisories surface without a
# code change. CI audits every change to the dependencies.

name: Dependency Audit

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check -D warnings
