# Libraries live in `crates/`, binaries in `apps/`.
[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/*",
    "crates/dirk_renderer/shaders",
    "crates/dirk_rhi/test-shaders",
    "crates/dirk_rhi/test-shaders/gpu",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/DirkEngine/DirkEngine"
version = "0.1.0"

homepage = "https://piquel.fr" # TODO: should piquel.fr/dirk of dirkengine.fr
authors = ["Piquel <contact@piquel.fr>"]
documentation = "https://docs.rs/dirkengine"
keywords = ["game", "engine", "gamedev", "graphics", "vulkan"]
categories = ["game-engines", "graphics", "rendering", "vulkan"]

[workspace.dependencies]
# Basic stuff
tracing = "0.1"
piquel-log = { version = "0.0.6", features = ["log", "file"] }
parking_lot = "0.12"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
tempfile = "3"
slotmap = "1"
signal-hook = "0.4"
clap = { version = "4", features = ["derive"] }

thiserror = "2"
anyhow = "1"
cargo_metadata = "0.21"

# Engine modules
dirk_build    = { version = "0.1.0", path = "crates/dirk_build" }
dirk_threads  = { version = "0.1.0", path = "crates/dirk_threads" }
dirk_utils    = { version = "0.1.0", path = "crates/dirk_utils" }
dirk_events   = { version = "0.1.0", path = "crates/dirk_events" }
dirk_proc     = { version = "0.1.0", path = "crates/dirk_proc" }
dirk_platform = { version = "0.1.0", path = "crates/dirk_platform" }
dirk_input    = { version = "0.1.0", path = "crates/dirk_input" }
dirk_renderer = { version = "0.1.0", path = "crates/dirk_renderer" }
dirk_assets   = { version = "0.1.0", path = "crates/dirk_assets" }
dirk_world    = { version = "0.1.0", path = "crates/dirk_world" }
dirk_universe = { version = "0.1.0", path = "crates/dirk_universe" }
dirk_player   = { version = "0.1.0", path = "crates/dirk_player" }
dirk_engine   = { version = "0.1.0", path = "crates/dirk_engine" }
dirk_editor   = { version = "0.1.0", path = "crates/dirk_editor" }

dirk_shaders  = { version = "0.1.0", path = "crates/dirk_shaders" }

# Main Engine Dependencies
winit = "0.31.0-beta.3"
ash = { version = "0.38", features = ["loaded"] }
ash-window = "0.13"
raw-window-handle = "0.6"
glam = { version = "0.33", default-features = false, features = ["f64", "integer-types", "libm"] }
gltf = "1"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
egui = "0.36"
egui_dock = "0.21"
egui-ash-renderer = "0.13"

# Shaders
cargo-gpu-install = "0.10.0"
spirv-std         = { version = "0.10.0", default-features = false, features = ["glam_0_33"] }
rspirv = "0.13"

# Macro dependencies
syn = { version = "2", features = ["full"] }
quote = "1"
pastey = "0.2"
proc-macro2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# rust-gpu compiles the shaders (`dirk_shaders_gpu`) for the `spirv` target_arch.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

# Every Clippy warning fails CI: `just lint` runs Clippy with `-D warnings`.
# The groups sit at priority -1 so the single lints below can override them.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Production code propagates errors; tests may panic (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, not `foo.rs` next to `foo/`.
self_named_module_files = "warn"
# Line tables keep file and line numbers in backtraces but drop the variable
# and type info that makes up most of a debug build's output. Also applies to
# tests, which inherit this profile.
[profile.dev]
debug = "line-tables-only"
