# The graph table configures how the dependency graph is constructed and thus
# which crates the checks are performed against
[graph]
# The platform targets to build for.
targets = []
# Packages to exclude from dependency graph.
exclude = []

all-features = true
no-default-features = false

# Features to enable when building the dependency graph.
features = []

# The output table provides options for how/if diagnostics are outputted
[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # egui_dock 0.18.0 depends on paste. 0.18.0 is pinned because it matches
    # the workspace's egui 0.33 version; newer egui_dock releases still depend
    # on paste and require egui 0.34.
    "RUSTSEC-2024-0436",

    # wayland-scanner 0.31.10 pins quick-xml to ^0.39, below the fixed 0.41
    # release. The vulnerable parser is used by Wayland code generation through
    # winit's Linux backend rather than on engine runtime input.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # egui 0.33 pulls ttf-parser through epaint -> ab_glyph. There is no safe
    # compatible upgrade until egui's font stack moves away from ttf-parser.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    # Apache
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",   # used by some LLVM-derived crates

    # MIT family
    "MIT",
    #"MIT-0",                             # MIT without attribution clause

    # BSD family
    "BSD-2-Clause",
    "BSD-3-Clause",
    #"BSD-4-Clause",

    # ISC (functionally equivalent to MIT)
    "ISC",
    #"OpenSSL",                           # used by openssl-sys and derivatives

    # Creative Commons / public domain
    #"CC0-1.0",
    "Unlicense",

    # Other common permissive licenses seen in the crates.io ecosystem
    "Zlib",
    #"Unicode-DFS-2016",                  # required by the `unicode-ident` crate
    "Unicode-3.0",
    "MPL-2.0",

    # Some random font licences
    "OFL-1.1",
    "Ubuntu-font-1.0"

]

confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "deny"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
# * lowest-version - The path to the lowest versioned duplicate is highlighted
# * simplest-path - The path to the version with the fewest edges is highlighted
# * all - Both lowest-version and simplest-path are used
highlight = "all"
# The default lint level for `default` features for crates that are members of
# the workspace that is being checked. This can be overridden by allowing/denying
# `default` on a crate-by-crate basis if desired.
workspace-default-features = "allow"
# The default lint level for `default` features for external crates that are not
# members of the workspace. This can be overridden by allowing/denying `default`
# on a crate-by-crate basis if desired.
external-default-features = "allow"
# List of crates that are allowed. Use with care!
allow = []
allow-workspace = true
deny = []

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    # ash-window still uses the older raw-window-metal/Core Graphics stack,
    # while the native Metal backend uses the current stack.
    { crate = "core-foundation@0.9.4", reason = "transitive Vulkan window dependency on Apple platforms" },
    { crate = "core-graphics-types@0.1.3", reason = "transitive Vulkan window dependency on Apple platforms" },
    { crate = "raw-window-metal@0.4.0", reason = "ash-window and the native Metal backend require different major versions" },

    # Rust-GPU reflection and SPIRV-Cross currently target different SPIR-V SDK
    # support crates. Both are build-only dependencies.
    { crate = "spirv@0.4.0", reason = "build-time MSL translation dependency" },
]

# Like skip but with entire direct & transitive dependency tree of crate
skip-tree = [
    { crate = "winit", reason = "depends on platform specific libraries that update very frequently" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
