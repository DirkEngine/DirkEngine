[package]
name = "dirk_shaders"
description = "Shaders used by the DirkEngine"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
bytemuck.workspace = true
dirk_proc.workspace = true

spirv-std = { workspace = true, optional = true }

[features]
# Shader-side access to the bindless heap, for shader crates. Host code needs
# only the shared types.
gpu = ["dep:spirv-std"]

# The workspace lints (../../Cargo.toml), except that `unsafe_code` is denied
# rather than forbidden: shader-side heap accesses and the `HeapIndices`
# implementations are unsafe, and expect it where they are.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Production code propagates errors; tests may panic (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, not `foo.rs` next to `foo/`.
self_named_module_files = "warn"
