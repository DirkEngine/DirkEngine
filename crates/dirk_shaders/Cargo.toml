[package]
name = "dirk_shaders"
description = "Shaders used by the DirkEngine"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
bytemuck.workspace = true
dirk_proc.workspace = true

spirv-std = { workspace = true, optional = true }

[features]
# Shader-side access to the bindless heap, for shader crates. Host code needs
# only the shared types.
gpu = ["dep:spirv-std"]

# The workspace forbids `unsafe`; shader-side heap accesses need it, so it is
# denied here and expected where they are.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
