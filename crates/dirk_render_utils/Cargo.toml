[package]
name = "dirk_render_utils"
description = "Rendering utilities built on DirkEngine's RHI"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

homepage.workspace = true
authors.workspace = true
documentation.workspace = true

[dependencies]
dirk_rhi.workspace = true

[dev-dependencies]
bytemuck.workspace = true
dirk_rhi_test_shaders = { version = "0.1.0", path = "../dirk_rhi/test-shaders" }

# Unlike the workspace, which forbids `unsafe`, this crate records raw RHI
# barriers: the render graph derives them, and uploads hand resources over.
# Every unsafe block states why its barrier describes the resource's accesses.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
