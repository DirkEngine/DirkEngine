[package]
name = "dirk_shaders_gpu"
description = "DirkEngine's shaders, compiled by rust-gpu"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

homepage.workspace = true
authors.workspace = true
documentation.workspace = true

[dependencies]
dirk_shaders = { workspace = true, features = ["gpu"] }
spirv-std.workspace = true

# spirv-std needs glam's integer vectors, which the workspace enables.
[target.'cfg(target_arch = "spirv")'.dependencies]
glam.workspace = true

[lints]
workspace = true
