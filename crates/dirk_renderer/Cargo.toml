[package]
name = "dirk_renderer"
description = "DirkEngine's renderer"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

homepage.workspace = true
authors.workspace = true
documentation.workspace = true

[dependencies]
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
parking_lot.workspace = true

dirk_engine.workspace = true
dirk_input.workspace = true
dirk_platform.workspace = true
dirk_player.workspace = true
dirk_universe.workspace = true
dirk_world.workspace = true
dirk_shaders.workspace = true
dirk_events.workspace = true
dirk_assets.workspace = true
dirk_rhi.workspace = true
dirk_render_utils.workspace = true

raw-window-handle.workspace = true
glam.workspace = true
gltf.workspace = true
egui = { workspace = true, optional = true, features = ["bytemuck"] }

[build-dependencies]
anyhow.workspace = true
dirk_build.workspace = true

[dev-dependencies]
dirk_rhi_test_shaders = { version = "0.1.0", path = "../dirk_rhi/test-shaders" }
dirk_threads.workspace = true

[features]
default = []

editor = [
    "dirk_engine/editor",
    "dirk_input/egui",
    "dep:egui",
]

# The workspace lints (../../Cargo.toml), except that `unsafe_code` is denied
# rather than forbidden: the shader build's generated `Shader` implementations
# are unsafe, and expect it where they are included.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Production code propagates errors; tests may panic (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, not `foo.rs` next to `foo/`.
self_named_module_files = "warn"
