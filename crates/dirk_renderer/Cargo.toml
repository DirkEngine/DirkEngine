[package]
name = "dirk_renderer"
description = "DirkEngine's renderer"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

homepage.workspace = true
authors.workspace = true
documentation.workspace = true

[dependencies]
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
pastey.workspace = true

dirk_utils.workspace = true
dirk_engine.workspace = true
dirk_input.workspace = true
dirk_platform.workspace = true
dirk_player.workspace = true
dirk_universe.workspace = true
dirk_world.workspace = true
dirk_shaders.workspace = true
dirk_events.workspace = true
dirk_assets.workspace = true

ash.workspace = true
ash-window.workspace = true
raw-window-handle.workspace = true
glam.workspace = true
gpu-allocator.workspace = true
gltf.workspace = true
slotmap.workspace = true
egui = { workspace = true, optional = true }
egui-ash-renderer = { workspace = true, optional = true }

[build-dependencies]
cargo-gpu-install.workspace = true
anyhow.workspace = true
rspirv.workspace = true
quote.workspace = true
proc-macro2.workspace = true

[features]
default = []

editor = [
    "dirk_engine/editor",
    "dirk_input/egui",
    "dep:egui",
    "dep:egui-ash-renderer",
]

# The workspace lints (../../Cargo.toml), except `unsafe_code`: the renderer
# calls Vulkan through ash.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Production code propagates errors; tests may panic (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, not `foo.rs` next to `foo/`.
self_named_module_files = "warn"
