[package]
name = "dirk_rhi"
description = "Backend-neutral render hardware interface for DirkEngine"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

homepage.workspace = true
authors.workspace = true
documentation.workspace = true

[dependencies]
anyhow.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash.workspace = true
ash-window.workspace = true
gpu-allocator.workspace = true

# gpu-allocator supports Metal only through `objc2-metal` handles, while this backend
# uses the `metal` crate's `objc` bindings. Resources are allocated by the device
# directly until the backend migrates to `objc2-metal` and heap sub-allocation.
[target.'cfg(target_vendor = "apple")'.dependencies]
# Objective-C blocks for Metal command-buffer completion handlers.
block = "0.1"
# `CGSize` for `CAMetalLayer::set_drawable_size`, whose signature uses this crate.
core-graphics-types = { version = "0.2", default-features = false }
metal = "0.33"
# Obtains the `CAMetalLayer` backing an AppKit or UIKit view.
raw-window-metal = "1.1"

# Unlike the workspace, which forbids `unsafe`, this crate is the audited boundary
# between native graphics APIs and their safe wrappers, so unsafe code is allowed
# here. Every native operation documents its contract with a `# Safety` section.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
