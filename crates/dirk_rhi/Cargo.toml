[package]
name = "dirk_rhi"
description = "DirkEngine's render hardware interface"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

homepage.workspace = true
authors.workspace = true
documentation.workspace = true

[dependencies]
bitflags.workspace = true
bytemuck.workspace = true
dirk_shaders.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

raw-window-handle = { workspace = true, features = ["std"] }

# Apple targets use Metal.
[target.'cfg(target_vendor = "apple")'.dependencies]
# Command buffer completion handlers.
block2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
# The `CAMetalLayer` of an AppKit or UIKit view.
raw-window-metal.workspace = true

# Every other target uses Vulkan.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash.workspace = true
ash-window.workspace = true
gpu-allocator.workspace = true

[dev-dependencies]
dirk_rhi_test_shaders = { version = "0.1.0", path = "test-shaders" }
raw-window-handle.workspace = true
# The presentation example opens a window and logs validation messages.
tracing-subscriber = "0.3"
winit.workspace = true

# Unlike the workspace, which forbids `unsafe`, this crate is the audited boundary
# between the native graphics API and its safe wrappers, so unsafe code is allowed
# here. Every unsafe block states why its native call is valid.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
