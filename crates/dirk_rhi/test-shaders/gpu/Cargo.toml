[package]
name = "dirk_rhi_test_shaders_gpu"
description = "rust-gpu shaders for dirk_rhi's native tests"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
bytemuck.workspace = true
dirk_shaders = { workspace = true, features = ["gpu"] }
spirv-std.workspace = true

# spirv-std needs glam's integer vectors, which the workspace enables.
[target.'cfg(target_arch = "spirv")'.dependencies]
glam.workspace = true

# The workspace lints (../../../../Cargo.toml), except that `unsafe_code` is
# denied rather than forbidden: writing storage images is unsafe, and expects
# it where it does.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Production code propagates errors; tests may panic (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, not `foo.rs` next to `foo/`.
self_named_module_files = "warn"
