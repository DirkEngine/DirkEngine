# How DirkEngine applies the engineering standard; the README of the
# `sourceorigin-standard` crate lists its rules and every key here.

# The modules that use unsafe code: the renderer's, which call Vulkan through
# ash until #133 replaces them with the RHI, and the RHI's native backend,
# unsafe API and the native tests calling it, each a test target's root. An
# `#[expect(unsafe_code)]` counts for the first entry holding it, so a crate
# root, for lib.rs's own calls, comes after its modules.
unsafe-modules = [
    "dirk_renderer::debug",
    "dirk_renderer::init",
    "dirk_renderer::physical_device",
    "dirk_renderer::pipeline::graphics",
    "dirk_renderer::proxy::scene",
    "dirk_renderer::resources",
    "dirk_renderer::shaders",
    "dirk_renderer::viewport_editor",
    "dirk_renderer::window",
    "dirk_renderer",
    "dirk_rhi::buffer",
    "dirk_rhi::command",
    "dirk_rhi::frame",
    "dirk_rhi::native",
    "dirk_rhi::shader",
    "dirk_rhi_test_shaders::generated",
    "frames",
    "pipelines",
    "resources",
]

# The binary's library, which holds `DefaultPlugins` and the CLI, and the build
# scripts' helpers.
anyhow-crates = ["dirkengine", "dirk_build"]

# Crates a build script compiles without depending on them: the renderer's
# compiles its shaders, so `just check-changed` checks it when they change.
[check-changed]
builds = [{ builder = "dirk_renderer", built = "dirk_shaders_gpu" }]

# The pull request checks of .github/workflows/pr.yml, read at a pull
# request's base. The scopes are the ones titles on main and the open pull
# requests use, each crate's and the tooling's.
[pr-checks]
scopes = [
    "agents",
    "assets",
    "build",
    "ci",
    "deps",
    "editor",
    "engine",
    "events",
    "input",
    "platform",
    "player",
    "proc",
    "project",
    "render-utils",
    "renderer",
    "rhi",
    "runtime",
    "shaders",
    "standard",
    "threads",
    "universe",
    "utils",
    "world",
    "worktree",
    "xtask",
]
approvers = ["PiquelChips"]
# Only reported until the open stack lands: about 20 of its pull requests
# change budget.toml or standard.toml, and each would need the label again
# after every push.
enforce-lint-exceptions = false

# Each scoped deviation lists the files its findings were in when DirkEngine
# adopted the standard; `cargo xtask standard --fix` drops each file once it
# complies.
[deviations]
rust-comments = "DirkEngine is written by hand, mostly without AI; it keeps its comments"
doc-length = "DirkEngine is written by hand, mostly without AI; it keeps its comments"
config-comments = "DirkEngine is written by hand, mostly without AI; it keeps its comments"

[deviations.inline-tests]
reason = "1 finding: the open pull request #133 deletes egui_integration.rs"
paths = ["crates/dirk_renderer/src/egui_integration.rs"]

[deviations.duplicate-items]
reason = "1 finding: the open pull request #133 deletes frame_graph.rs, which viewport.rs repeats"
paths = ["crates/dirk_renderer/src/viewport.rs"]

[deviations.anyhow-edges]
reason = "7 findings: plugin and subsystem callbacks and asset loaders return anyhow errors, and the coming API overhaul types their errors"
crates = [
    "dirk_assets",
    "dirk_editor",
    "dirk_engine",
    "dirk_platform",
    "dirk_player",
    "dirk_renderer",
    "dirk_world",
]

[deviations.agents-md]
reason = "AGENTS.md holds 192 lines, over 150, while the open stack edits it; once the stack lands, a later pull request adds the crate map and trims it to 150 lines"
paths = ["AGENTS.md"]
