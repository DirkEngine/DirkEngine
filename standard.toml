# How DirkEngine applies the engineering standard; the README of the
# `sourceorigin-standard` crate lists its rules and every key here.

# The renderer's modules that call Vulkan through ash, which #133 replaces with
# the RHI's. An `#[expect(unsafe_code)]` counts for the first entry holding it,
# so the crate root, for lib.rs's own calls, comes last.
unsafe-modules = [
    "dirk_renderer::debug",
    "dirk_renderer::init",
    "dirk_renderer::physical_device",
    "dirk_renderer::pipeline::graphics",
    "dirk_renderer::proxy::scene",
    "dirk_renderer::resources",
    "dirk_renderer::shaders",
    "dirk_renderer::viewport_editor",
    "dirk_renderer::window",
    "dirk_renderer",
]

# The binary's library, which holds `DefaultPlugins` and the CLI, and the build
# scripts' helpers.
anyhow-crates = ["dirkengine", "dirk_build"]

# The pull request checks of .github/workflows/pr.yml, read at a pull
# request's base. The scopes are the ones titles on main and the open pull
# requests use, each crate's and the tooling's.
[pr-checks]
scopes = [
    "agents",
    "assets",
    "build",
    "ci",
    "deps",
    "editor",
    "engine",
    "events",
    "input",
    "platform",
    "player",
    "proc",
    "project",
    "render-utils",
    "renderer",
    "rhi",
    "runtime",
    "shaders",
    "standard",
    "threads",
    "universe",
    "utils",
    "world",
    "worktree",
    "xtask",
]
approvers = ["PiquelChips"]
# Only reported until the open stack lands: about 20 of its pull requests
# change budget.toml or standard.toml, and each would need the label again
# after every push.
enforce-lint-exceptions = false

# Each deviation lists the files its findings were in when DirkEngine adopted
# the standard; `cargo xtask standard --fix` drops each file once it complies.
[deviations.rust-comments]
reason = "260 findings: those in the files the open pull requests #72, #104, #106 and #133 rewrite or delete end with those pull requests; the rest are fixed in a follow-up"
